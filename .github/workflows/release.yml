# Push a version tag (npm version patch && git push --follow-tags) and this
# builds the Android APK + Windows installer, attaches them to a GitHub
# Release, and redeploys the web version to GitHub Pages.
#
# The release stays a draft until every build succeeds, so the in-app
# updaters (which read /releases/latest) never see a half-finished release.
#
# Repo secrets needed:
#   ANDROID_KEYSTORE_BASE64            base64 of android/upload-key.jks
#   ANDROID_KEYSTORE_PROPERTIES        contents of android/keystore.properties
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/slingshot-ops.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD contents of ~/.tauri/slingshot-ops.key.password

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Slingshot Ops $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:android
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload-key.jks
          printf '%s\n' "$KEYSTORE_PROPS" > android/keystore.properties
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SlingshotOps-${GITHUB_REF_NAME#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --repo "$GITHUB_REPOSITORY"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true

  pages:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

  publish:
    needs: [draft, pages]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            -F draft=false -f make_latest=true
