# Push a version tag (npm version patch && git push --follow-tags) and this
# builds the Windows installer, attaches it to a GitHub Release, and
# redeploys the web version to GitHub Pages.
#
# Windows only since 2.0.0: the Android project stays in the repo but isn't
# released (Android installs see no .apk in newer releases, so no update).
#
# The release stays a draft until every build succeeds, so the in-app
# updaters (which read /releases/latest) never see a half-finished release.
#
# Actions are pinned to commit SHAs so a hijacked tag cannot reach the secrets.
#
# Repo secrets needed:
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/slingshot-ops.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD contents of ~/.tauri/slingshot-ops.key.password

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="KLONKADOO $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true

  pages:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages pushes from its own clone, which doesn't inherit checkout's credentials
          npx gh-pages -d dist -r "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

  publish:
    needs: [draft, pages]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            -F draft=false -f make_latest=true
