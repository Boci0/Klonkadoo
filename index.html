<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10111c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>KLONKADOO: Mech Roguelike</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/Klonkadoo/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/Klonkadoo/icon-512.png" />
  <link rel="apple-touch-icon" href="/Klonkadoo/icon-512.png" />
  <script type="module" crossorigin src="/Klonkadoo/assets/index-C2OCo5VS.js"></script>
  <link rel="stylesheet" crossorigin href="/Klonkadoo/assets/index-fbQgutgh.css">
</head>

<body>
  <div id="app">
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <!-- ===== MAIN MENU ===== -->
    <section id="screen-menu" class="screen">
      <canvas id="menu-bg" class="menu-bg" aria-hidden="true"></canvas>
      <div class="menu-panel">
        <div class="menu-left">
          <h1 class="game-title">KLONKA<span>DOO</span></h1>
          <p class="game-tagline">&gt; MECH ROGUELIKE_</p>
          <div id="menu-stats" class="menu-stats px-frame"></div>
          <button id="menu-daily" class="daily-card px-frame" type="button"></button>
        </div>
        <div class="menu-buttons">
          <button id="btn-play" class="btn btn-primary btn-large btn-menu">&#9654; START OPERATION</button>
          <div class="menu-tiles">
            <button id="btn-gear" class="menu-tile" data-icon="gun"><span>RIG</span></button>
            <button id="btn-almanac" class="menu-tile" data-icon="book"><span>ALMANAC</span></button>
            <button id="btn-medals" class="menu-tile" data-icon="star"><span>MEDALS</span></button>
          </div>
          <div class="menu-row">
            <button id="btn-settings" class="btn btn-outline btn-menu">SETTINGS</button>
            <button id="btn-support" class="btn btn-outline btn-menu btn-support" aria-label="Support the game">&#9829; SUPPORT</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== RIG ===== -->
    <section id="screen-rig" class="screen hidden">
      <div class="screen-header">
        <button id="btn-rig-back" class="btn btn-outline btn-back">&#9664; BACK</button>
        <div class="rig-tabs">
          <button data-rtab="loadout">RIG</button>
          <button data-rtab="pods">PODS</button>
        </div>
        <div id="rig-wallet" class="rig-wallet"></div>
      </div>
      <div id="rig-body" class="rig-body"></div>
    </section>

    <!-- ===== RUN MAP ===== -->
    <section id="screen-run" class="screen hidden">
      <header class="run-topbar">
        <div class="run-floortabs" id="run-floortabs"></div>
        <div class="run-chips">
          <div class="hud-chip hud-hp">
            <span>HP</span><strong id="run-hp">-</strong>
            <div class="hud-hpbar"><i id="run-hp-bar"></i></div>
          </div>
          <div class="hud-chip hud-actions"><span>MOVES</span><strong id="run-actions">-</strong></div>
          <div class="hud-chip hud-gold"><span>GOLD</span><strong id="run-gold">-</strong></div>
        </div>
        <div class="run-topbar-btns">
          <button class="btn btn-outline btn-hud" data-drawer="status">STATUS</button>
        </div>
      </header>
      <div class="run-body">
        <aside id="drawer-status" class="run-drawer run-sidebar" aria-label="Status">
          <div class="drawer-head"><h3>STATUS</h3><button class="btn btn-outline drawer-close" data-drawer-close>&#10005;</button></div>
          <div class="drawer-scroll">
            <div class="run-panel">
              <h3>STATUS</h3>
              <div id="run-stats" class="run-stats"></div>
              <div id="run-boons" class="run-boons"></div>
            </div>
            <div class="run-panel">
              <h3>QUESTS</h3>
              <div id="run-quests" class="run-quests"></div>
            </div>
            <button id="btn-retreat" class="btn btn-danger">ABANDON RUN</button>
          </div>
        </aside>
        <main class="run-main">
          <div id="map-view" class="map-view">
            <canvas id="map-canvas"></canvas>
            <div id="map-hint" class="map-hint">TAP A BLINKING TILE TO MOVE</div>
            <div class="map-zoom-bar">
              <button id="btn-zoom-out" class="btn btn-outline map-zoom-btn" title="Zoom Out">&minus;</button>
              <span id="zoom-level">100%</span>
              <button id="btn-zoom-in" class="btn btn-outline map-zoom-btn" title="Zoom In">+</button>
              <button id="btn-zoom-reset" class="btn btn-outline map-zoom-btn" title="Fit Map">FIT</button>
            </div>
          </div>
          <div id="battle-view" class="battle-view hidden">
            <canvas id="game-canvas" width="1280" height="750"></canvas>
          </div>
        </main>
        <div class="drawer-scrim" data-drawer-close></div>
      </div>
    </section>

    <!-- ===== BATTLE HUD ===== -->
    <div id="battle-hud" class="battle-hud hidden">
      <div class="battle-top">
        <strong id="battle-floor">FLOOR 1</strong><span>&middot;</span><strong id="battle-node">COMBAT</strong><span>&middot;</span><strong id="battle-gold">0G</strong>
      </div>
      <div class="battle-left">
        <button id="btn-retreat-battle" class="btn btn-outline btn-battle-small" title="Flee this fight">&#9664; RETREAT</button>
        <button id="btn-audio-toggle" class="btn btn-outline btn-battle-small" title="Toggle Audio">SND ON</button>
      </div>
      <div id="mech-hud" class="mech-hud"></div>
      <div id="team-bar" class="team-bar hidden"></div>
      <div class="battle-abilities">
        <button id="btn-stomp" class="ability-btn ability-stomp" aria-label="Stomp">
          <span class="ability-icon">F</span>
          <span class="ability-name">STOMP</span>
          <span class="ability-cd" id="cd-stomp"></span>
        </button>
        <button id="btn-vent" class="ability-btn ability-vent hidden" aria-label="Vent">
          <span class="ability-icon">V</span>
          <span class="ability-name">VENT</span>
          <span class="ability-cd" id="cd-vent"></span>
        </button>
        <button id="btn-end-turn" class="ability-btn ability-end hidden" aria-label="End turn">
          <span class="ability-icon">&#9654;</span>
          <span class="ability-name">END TURN</span>
          <span class="ability-cd action-pips" id="action-pips"></span>
        </button>
      </div>
    </div>

    <!-- ===== RESULT ===== -->
    <section id="screen-result" class="screen hidden">
      <div class="result-panel">
        <div class="result-main">
          <h2 id="result-title">OPERATION COMPLETE</h2>
          <p id="result-sub"></p>
          <div id="result-stats" class="result-stats"></div>
          <div id="result-tp" class="result-tp"></div>
          <div id="result-risk" class="result-risk hidden"></div>
          <button id="btn-run-end" class="btn btn-primary">RETURN TO BASE</button>
        </div>
        <div class="result-side">
          <h3>QUESTS</h3>
          <div id="result-quests" class="result-quests"></div>
        </div>
      </div>
    </section>

    <!-- ===== BOSS INTRO ===== -->
    <div id="boss-intro" class="boss-intro hidden" role="dialog" aria-label="Boss incoming">
      <div class="boss-stripes"></div>
      <div class="boss-card">
        <div class="boss-warning">&#9888; WARNING &#9888;</div>
        <div class="boss-sub" id="boss-intro-sub">MINI-BOSS</div>
        <div class="boss-name" id="boss-intro-name">COMMANDER</div>
        <div class="boss-desc" id="boss-intro-desc"></div>
        <div class="boss-tap">TAP TO FIGHT</div>
      </div>
      <div class="boss-stripes bottom"></div>
    </div>

    <!-- ===== NODE MODAL ===== -->
    <div id="node-modal" class="modal">
      <div class="modal-content">
        <h3 id="node-modal-title">NODE</h3>
        <div id="node-modal-body"></div>
        <div id="node-modal-actions"></div>
      </div>
    </div>
  </div>
</body>

</html>
